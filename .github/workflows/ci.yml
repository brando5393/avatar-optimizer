name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & unit/infra tests
    runs-on: ubuntu-latest
    # Successful runs take 3-5 min even with the Docker/QEMU-bundled sharp
    # build. GitHub's own default is 360 min with no job-level override —
    # far too long to silently hang on a stuck Docker build.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ProcessingStack's process-upload Lambda bundles `sharp` (a native
      # module) for arm64 via Docker; GitHub's runners are amd64, so without
      # QEMU that Docker build fails with "exec format error".
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - run: npm ci

      - name: Lint (typecheck) every workspace
        run: npm run lint

      - name: Unit + CDK assertion tests
        run: npm test

      - name: cdk synth (infra must synthesize cleanly)
        working-directory: infra
        run: npx cdk synth --quiet

  e2e-and-a11y:
    name: Playwright + axe-core
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run e2e + accessibility tests
        working-directory: frontend
        run: npm run test:e2e
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
